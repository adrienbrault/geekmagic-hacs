name: Hassfest

on:
  push:
    branches: [main]
  # Every base, not only main: a stacked PR targets the branch below it
  pull_request:
  schedule:
    - cron: "0 0 * * *"

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
