name: CI

on:
  push:
    branches: [main]
  # Every base, not only main: a stacked PR targets the branch below it
  pull_request:

# A new push to a PR supersedes its previous run. Runs on main are never
# cancelled (the group is unique per commit there).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install pre-commit
        run: uv tool install pre-commit

      - name: Run pre-commit (ruff)
        run: |
          pre-commit run --all-files ruff
          pre-commit run --all-files ruff-format

  # This matrix is a Home Assistant matrix wearing a Python matrix's clothes.
  #
  # uv.lock is gitignored on purpose, so every run resolves fresh. Each
  # pytest-homeassistant-custom-component release pins one EXACT Home
  # Assistant version and raises its own requires-python in lockstep, so the
  # Python version alone decides which core the suite runs against:
  #
  #   3.12 -> the oldest ptc that still supports it -> an old, frozen core
  #   3.13 -> a ptc a few months back              -> the current stable core
  #   3.14 -> the newest ptc                       -> the newest core, which
  #                                                   is a BETA whenever Home
  #                                                   Assistant has one out
  #
  # As of 2026-09 that reads 2025.1.4 / 2026.2.3 / 2026.9.0b6. The mapping
  # moves on its own; the "Resolved Home Assistant version" step below prints
  # what a given run actually got.
  #
  # The newest leg is deliberately merge-blocking. Resolving unpinned is how
  # the 2026.9 deprecation of device_registry.async_get_device surfaced months
  # before it would have reached users, and a red check is what got it fixed
  # the same day. The cost is accepted: an upstream beta can turn an unrelated
  # PR red, and the fix belongs on main rather than in the contributor's branch.
  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.ha }} HA)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            ha: oldest
          - python-version: "3.13"
            ha: current
          - python-version: "3.14"
            ha: newest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev --python ${{ matrix.python-version }}

      # Which core this leg resolved to, so a failure that is really an
      # upstream change is one glance away rather than a log archaeology dig.
      - name: Resolved Home Assistant version
        run: |
          uv run --python ${{ matrix.python-version }} python -c \
            "from homeassistant.const import __version__; print(__version__)"

      # Coverage only where it is uploaded: it adds ~40% to the suite.
      - name: Run tests
        run: >-
          uv run --python ${{ matrix.python-version }} pytest -v -n auto
          ${{ matrix.ha == 'current' && '--cov=custom_components/geekmagic --cov-report=xml' || '' }}

      # Upload from the stable leg. The newest leg tracks Home Assistant
      # betas, so its coverage disappears whenever that resolution breaks.
      - name: Upload coverage to Codecov
        if: matrix.ha == 'current'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Run type checker
        run: uv run ty check
        continue-on-error: true  # ty is experimental, don't fail CI

  # The offline view renderer (skills/geekmagic-views) runs where Home
  # Assistant isn't installed: an AI's sandbox, a laptop. Only its own
  # dependencies here, and every example must render cleanly (the script
  # exits non-zero when the engine is missing or a widget fails).
  render-cli:
    name: Render without Home Assistant (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install only the renderer's dependencies
        run: |
          pin=$(python -c "import json; print(json.load(open('custom_components/geekmagic/manifest.json'))['requirements'][0])")
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet "$pin" pillow jinja2

      - name: Home Assistant is not importable
        run: |
          "$RUNNER_TEMP/venv/bin/python" -c "import importlib.util, sys; sys.exit(importlib.util.find_spec('homeassistant') is not None)"

      - name: Render every example
        run: |
          python="$RUNNER_TEMP/venv/bin/python"
          for view in skills/geekmagic-views/examples/*.json; do
            out="$RUNNER_TEMP/$(basename "$view" .json).png"
            "$python" skills/geekmagic-views/scripts/render_view.py "$view" -o "$out"
            "$python" -c "import sys; from PIL import Image; im = Image.open(sys.argv[1]); assert im.size == (240, 240), im.size; assert len(im.convert('RGB').getcolors(240 * 240) or []) > 64, 'blank'" "$out"
          done

      - name: Contact sheet, schema and validation
        run: |
          python="$RUNNER_TEMP/venv/bin/python"
          cli=skills/geekmagic-views/scripts/render_view.py
          "$python" "$cli" --schema > /dev/null
          "$python" "$cli" --demo > /dev/null
          "$python" "$cli" skills/geekmagic-views/examples/morning.json --theme watchos --theme night -o "$RUNNER_TEMP/sheet.png"
          echo '{"layout": "grid_9x9", "widgets": []}' > "$RUNNER_TEMP/bad.json"
          if "$python" "$cli" "$RUNNER_TEMP/bad.json" --check; then
            echo "::error::an invalid view passed --check"
            exit 1
          fi

      # The PEP 723 block is what `uv run render_view.py` installs from
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Render with uv run
        run: >-
          uv run --no-project --python ${{ matrix.python-version }}
          skills/geekmagic-views/scripts/render_view.py
          skills/geekmagic-views/examples/html-bedside.json -o "$RUNNER_TEMP/uv.png"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: custom_components/geekmagic/frontend/package-lock.json

      - name: Install dependencies
        working-directory: custom_components/geekmagic/frontend
        run: npm ci

      - name: Run TypeScript typecheck
        working-directory: custom_components/geekmagic/frontend
        run: npm run typecheck

      - name: Run frontend tests
        working-directory: custom_components/geekmagic/frontend
        run: npm test

      - name: Verify dist is up-to-date
        working-directory: custom_components/geekmagic/frontend
        run: |
          npm run build
          if ! git diff --exit-code dist/; then
            echo "ERROR: Frontend dist/ is out of date. Run 'npm run build' and commit the changes."
            exit 1
          fi

  e2e:
    name: End-to-end (panel in a real Home Assistant)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The same throwaway HA + fake device + seeded views as local dev.
      # Started first, in the background: pulling the HA image is the
      # slowest step (~55s), and Node and Chromium install meanwhile.
      - name: Start Home Assistant (background)
        run: |
          # set +e: the step's `bash -e` would otherwise end the subshell on
          # failure before it records the status, and the wait would time out.
          (set +e
           scripts/dev-ha up > "$RUNNER_TEMP/dev-ha-up.log" 2>&1
           echo $? > "$RUNNER_TEMP/dev-ha-up.status") &

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: custom_components/geekmagic/frontend/package-lock.json

      - name: Install dependencies
        working-directory: custom_components/geekmagic/frontend
        run: npm ci

      # Headless runs only need Chromium's headless shell, not the full browser.
      - name: Install Chromium
        working-directory: custom_components/geekmagic/frontend
        run: npx playwright install --with-deps --only-shell chromium

      - name: Wait for Home Assistant
        run: |
          for _ in $(seq 300); do
            [ -f "$RUNNER_TEMP/dev-ha-up.status" ] && break
            sleep 1
          done
          cat "$RUNNER_TEMP/dev-ha-up.log"
          status=$(cat "$RUNNER_TEMP/dev-ha-up.status" 2>/dev/null || echo timeout)
          if [ "$status" != 0 ]; then
            echo "::error::scripts/dev-ha up failed ($status)"
            exit 1
          fi

      - name: Run end-to-end tests
        working-directory: custom_components/geekmagic/frontend
        run: npx playwright test

      - name: Home Assistant logs
        if: failure()
        run: scripts/dev-ha logs

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            custom_components/geekmagic/frontend/playwright-report/
            custom_components/geekmagic/frontend/test-results/
          retention-days: 7
