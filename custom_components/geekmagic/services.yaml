notify:
  name: Show Notification
  description: Shows a temporary notification on the display.
  fields:
    device_id:
      name: Device
      description: The GeekMagic device(s) to show the notification on.
      required: true
      selector:
        device:
          integration: geekmagic
    message:
      name: Message
      description: The notification text. If omitted, the image/icon will be fullscreen.
      required: false
      selector:
        text:
    icon:
      name: Icon
      description: Icon to display (e.g. mdi:bell).
      required: false
      selector:
        icon:
    image:
      name: Image Entity
      description: Home Assistant entity to use for the image (e.g., camera.front_door, image.last_person, or media_player.spotify).
      required: false
      selector:
        entity: {}
    image_url:
      name: Image URL or Path
      description: Picture to show instead of an entity, as an http(s) URL or a file under the config folder's www/ directory (e.g. /local/alarm.png or www/alarm.png). Takes precedence over Image Entity. Animated GIFs show their first frame.
      required: false
      selector:
        text:
    duration:
      name: Duration
      description: How long to show the notification in seconds (default 10).
      required: false
      default: 10
      selector:
        number:
          min: 1
          max: 300
          unit_of_measurement: seconds
    theme:
      name: Theme
      description: Visual theme for the notification (default Classic).
      required: false
      selector:
        select:
          options:
            - classic
            - minimal
            - neon
            - retro
            - soft
            - ocean
            - sunset
            - forest
            - light
            - candy

show_view:
  name: Show View
  description: Shows one of the display's views now. With a duration, the display goes back to what it showed before once the time is up, and View Cycling waits meanwhile.
  fields:
    device_id:
      name: Device
      description: The GeekMagic display(s) to show the view on.
      required: true
      selector:
        device:
          integration: geekmagic
    view:
      name: View
      description: The view's name, as in the panel (not case sensitive). It must be assigned to the display; it may be one View Cycling skips.
      required: true
      example: Shower
      selector:
        text:
    duration:
      name: Duration
      description: How long to show it before going back. Leave it out to show the view until something else changes it, like the Display select does.
      required: false
      selector:
        duration:

set_view_cycling:
  name: Set View Cycling for a View
  description: Includes views in View Cycling or skips them. A skipped view stays on the display, and the Display select and Show View can still show it.
  fields:
    device_id:
      name: Device
      description: The GeekMagic display(s) to change.
      required: true
      selector:
        device:
          integration: geekmagic
    view:
      name: View
      description: The view's name, as in the panel (not case sensitive), or a list of names.
      required: true
      example: Car charging
      selector:
        text:
    cycle:
      name: Cycle
      description: On to include the views in View Cycling, off to skip them.
      required: true
      selector:
        boolean:
